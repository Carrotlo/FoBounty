tokens:
  prefix: "{theme}FoBounty &8» {muted}"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"

no-permission: "{prefix}{bad}You don't have permission."
player-only: "{prefix}{bad}Only players can do this."
unknown-player: "{prefix}{bad}Player {theme}{player}{bad} was not found in cache/online players."
invalid-number: "{prefix}{bad}Invalid amount. Use a number or suffix (k/m/b/t)."
self-bounty: "{prefix}{bad}You cannot place a bounty on yourself."
amount-too-low: "{prefix}{bad}Minimum bounty is {theme}${min}{bad}."
amount-too-high: "{prefix}{bad}Maximum bounty is {theme}${max}{bad}."
no-economy: "{prefix}{bad}No Vault economy provider found."
not-enough-money: "{prefix}{bad}You do not have enough money."
add-success: "{prefix}{good}Added {theme}${amount}{good} on {theme}{player}{good}. Total: {theme}${total}{good}."
add-announce: "{prefix}{white}{setter} set {theme}${amount}{white} on {theme}{target}{white}. Total now: {theme}${total}{white}."
add-failed: "{prefix}{bad}Could not add bounty right now. Try again."
history-empty: "{prefix}{muted}No history for {theme}{player}{muted}."
history-header: "{prefix}{muted}History for {theme}{player}{muted}:"
