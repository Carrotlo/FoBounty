# Public bounty history GUI.
# Slots are 0-based. Inventory rows must be 1-6. Invalid slots/materials fall back safely.
# The bundled title already uses the default Fo presentation. Custom titles are preserved exactly.
# Common item keys: slot, material, amount, name, lore, custom-model-data, glow, flags.

title: "ʙᴏᴜɴᴛʏ ʜɪꜱᴛᴏʀʏ"
rows: 6

# Dynamic history entries render in these slots.
content-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  - 37
  - 38
  - 39
  - 40
  - 41
  - 42
  - 43

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

empty-content:
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  previous-page:
    slot: 45
    material: ARROW
    name: ":arrow: {theme}&lPREVIOUS PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage: {theme}{page}/{max_page}"
      - " "
      - "{good}→ Click to View the Previous Page ←"
  next-page:
    slot: 53
    material: ARROW
    name: ":arrow: {theme}&lNEXT PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage: {theme}{page}/{max_page}"
      - " "
      - "{good}→ Click to View the Next Page ←"
  back-to-bounties:
    slot: 49
    material: IRON_DOOR
    name: ":iron_door: &e&lBACK TO BOUNTIES"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fReturn to the bounty browser."
      - " "
      - "{good}→ Click to Go Back ←"

# Dynamic history entry items.
# Valid placeholders: {type}, {player}, {related}, {target}, {amount}, {amount_raw}, {reason}, {time}.
entries:
  claimed:
    material: EMERALD
    name: "{theme}Claimed ${amount}"
    lore:
      - "{white}Time: {theme}{time}"
      - "{white}Target: {theme}{related}"
      - "{white}Reason: {theme}{reason}"
  lost:
    material: REDSTONE
    name: "{theme}Lost ${amount}"
    lore:
      - "{white}Time: {theme}{time}"
      - "{white}By: {theme}{related}"
      - "{white}Reason: {theme}{reason}"

labels:
  unknown-player: "Unknown"
  natural-death: "Natural Death"
  reasons:
    PVP: "PvP"
    NATURAL_DEATH: "Natural Death"
