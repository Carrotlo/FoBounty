# Public bounty browser GUI.
# Slots are 0-based. Inventory rows must be 1-6. Invalid slots/materials fall back safely.
# The bundled title already uses the default Fo presentation. Custom titles are preserved exactly.
# Common item keys: slot, material, amount, name, lore, custom-model-data, glow, flags.
# Valid main placeholders: {own_bounty}, {own_bounty_raw}, {total_earned}, {total_earned_raw}, {search}, {page}, {max_page}.

title: "ʙᴏᴜɴᴛʏ ʙʀᴏᴡꜱᴇʀ"
rows: 6

# Dynamic active bounty entries render in these slots.
content-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

empty-content:
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: CLOCK
    name: ":clock: {theme}&lINFO"
    lore:
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fUse {theme}/bounty add <player> <amount>"
      - "&7&l | &fYour bounty: {theme}${own_bounty}"
      - "&7&l | &fTotal earned: {theme}${total_earned}"
  filter:
    slot: 48
    material: HOPPER
    name: ":hopper: {theme}&lFILTER"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fSelect which bounties to show."
      - "{filters}"
      - " "
      - "{good}→ Click to Cycle ←"
    # Valid placeholder for these lines: {filter}.
    selected-line: "&7&l | {theme}» {filter}"
    unselected-line: "&7&l | {white}• {filter}"
    labels:
      OLDEST: "Oldest"
      NEWEST: "Newest"
      HIGHEST: "Highest"
      LOWEST: "Lowest"
  refresh:
    slot: 49
    material: COMPASS
    name: ":compass: {theme}&lREFRESH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fRefreshes the current page."
      - " "
      - "{good}→ Click to Refresh ←"
  search:
    slot: 50
    material: NAME_TAG
    name: ":name_tag: &e&lSEARCH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fCurrent: {current}"
      - " "
      - "{good}→ Click to Set a Filter ←"
  clear-search:
    slot: 51
    material: MILK_BUCKET
    name: ":milk_bucket: {theme}&lCLEAR SEARCH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fShow all {target}."
      - " "
      - "{good}→ Click to Clear the Search ←"
  history:
    slot: 47
    material: WRITABLE_BOOK
    name: ":writable_book: {theme}&lHISTORY"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fView bounty claim and loss history."
      - " "
      - "{good}→ Click to View History ←"
  previous-page:
    slot: 45
    material: ARROW
    name: ":arrow: {theme}&lPREVIOUS PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage: {theme}{page}/{max_page}"
      - " "
      - "{good}→ Click to View the Previous Page ←"
  next-page:
    slot: 53
    material: ARROW
    name: ":arrow: {theme}&lNEXT PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage: {theme}{page}/{max_page}"
      - " "
      - "{good}→ Click to View the Next Page ←"

# Dynamic bounty entry.
# Valid placeholders: {player}, {target}, {amount}, {amount_raw}, {created_at}, {updated_at}, {contributions}.
bounty-item:
  material: PLAYER_HEAD
  name: "{theme}{player}"
  lore:
    - "&8ʙᴜᴛᴛᴏɴ"
    - " "
    - "&eⓘ Information ↓"
    - "&7&l | &fAmount: {theme}${amount}"
    - "&7&l | &fSet by:"
    - "{contributions}"
    - " "
    - "{good}→ Click to View History ←"
  # Valid contribution placeholders: {setter}, {amount}, {amount_raw}.
  contribution-line: "&7&l | &f{theme}• {setter} {white}- {theme}${amount}"
  more-contributors-line: "&7&l | &f{muted}• More contributors hidden"

labels:
  no-search: "{muted}None"
  clear-search-target: "bounties"
  unknown-player: "Unknown"
