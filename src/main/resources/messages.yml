history-line-lost: "{white}- {theme}{time}{white} Lost {theme}${amount}{white} ({theme}{reason}{white})."
admin-remove-success: "{prefix}{good}Removed bounty from {theme}{player}{good}."
admin-remove-none: "{prefix}{bad}{player} has no active bounty."
admin-remove-failed: "{prefix}{bad}Could not remove bounty from {theme}{player}{bad}. Check console for details."
admin-usage: "{prefix}{muted}Usage: {theme}/{command} <editor|reload|version|remove> [player]{muted}."
admin-remove-usage: "{prefix}{muted}Usage: {theme}/{command} remove <player>{muted}."
admin-version: "{prefix}{muted}Version {theme}{version}{muted} by {theme}Carrotio{muted}."
reload-success: "{prefix}{good}Reloaded config.yml, messages.yml, guis, and dialogs."
reload-failed: "{prefix}{bad}Reload failed at {theme}{step}{bad}. {muted}{error}"
search-cancelled: "{prefix}{muted}Search cancelled."
search-no-match: "{prefix}{bad}No active bounty found for {theme}{player}{bad}."
native-dialogs-unavailable: "{prefix}{muted}Native dialogs are not supported on this server, using chat input."
claim-reward: "{prefix}{good}You claimed {theme}${amount}{good} for killing {theme}{target}{good}."
