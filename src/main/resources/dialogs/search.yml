# Public search input. Native Paper dialog and chat fallback share these owner values.
title: "{theme}Search Bounties"
body:
  - "{muted}Enter a player name to filter active bounties."
  - "{muted}Use the Cancel button to return without changing the search."
field-label: "{white}Player name"
initial-value: "{current}"
# Chat guidance; the Paper text input API has no placeholder field.
placeholder: ""
confirm-button:
  label: "{good}Search"
  tooltip: ""
  icon: "spyglass"
  width: 100
cancel-button:
  label: "{bad}Cancel"
  tooltip: ""
  icon: "barrier"
  width: 100
button-order: [cancel, confirm]
body-width: 300
input-width: 300
max-length: 32
label-visible: true
can-close-with-escape: false
pause: false
cancel-keyword: "cancel"
chat-lines:
  - "{title}"
  - "{body}"
  - "{field-label}: {current}"
  - "{placeholder}"
  - "{muted}Type {bad}{cancel-keyword}{muted} to cancel."
