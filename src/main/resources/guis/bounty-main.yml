title: "ʙᴏᴜɴᴛʏ ʙʀᴏᴡꜱᴇʀ"
rows: 6
filler:
  enabled: true
  material: "GRAY_STAINED_GLASS_PANE"
  name: " "
buttons:
  filter:
    slot: 48
    material: "HOPPER"
    name: ":hopper: {theme}&lFILTER"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fSelect which bounties to show."
      - "{options}"
      - " "
      - "{good}→ Click to Cycle ←"
    enabled: true
    action: "bounty.filter"
    cycle:
      selected-format: "&7&l | {theme}» {option}"
      unselected-format: "&7&l | {white}• {option}"
  refresh:
    slot: 49
    material: "COMPASS"
    name: ":compass: {theme}&lREFRESH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fRefreshes the current page."
      - " "
      - "{good}→ Click to Refresh ←"
    enabled: true
    action: "bounty.refresh"
  search:
    slot: 50
    material: "NAME_TAG"
    name: ":name_tag: &e&lSEARCH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fCurrent: {current}"
      - " "
      - "{good}→ Click to Set a Filter ←"
    enabled: true
    action: "bounty.search"
  clear-search:
    slot: 51
    material: "MILK_BUCKET"
    name: ":milk_bucket: {theme}&lCLEAR SEARCH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fShow all {target}."
      - " "
      - "{good}→ Click to Clear the Search ←"
    enabled: true
    action: "bounty.clear-search"
    states:
      hidden:
        clickable: false
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
  history:
    slot: 47
    material: "WRITABLE_BOOK"
    name: ":writable_book: {theme}&lHISTORY"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fView bounty claim and loss history."
      - " "
      - "{good}→ Click to View History ←"
    enabled: true
    action: "bounty.history"
  previous-page:
    slot: 45
    material: "ARROW"
    name: ":arrow: {theme}&lPREVIOUS PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage: {theme}{page}/{max_page}"
      - " "
      - "{good}→ Click to View the Previous Page ←"
    enabled: true
    action: "bounty.previous-page"
    states:
      hidden:
        clickable: false
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
  next-page:
    slot: 53
    material: "ARROW"
    name: ":arrow: {theme}&lNEXT PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage: {theme}{page}/{max_page}"
      - " "
      - "{good}→ Click to View the Next Page ←"
    enabled: true
    action: "bounty.next-page"
    states:
      hidden:
        clickable: false
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
entries:
  bounties:
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
    source-item: {}
    empty-item:
      material: "LIGHT_GRAY_STAINED_GLASS_PANE"
      name: " "
    actions:
      left: "bounty.entry-history"
      right: "bounty.entry-history"
      shift-left: "bounty.entry-history"
      shift-right: "bounty.entry-history"
      drop: "bounty.entry-history"
      control-drop: "bounty.entry-history"
      middle: "bounty.entry-history"
      number-key: "bounty.entry-history"
      swap-offhand: "bounty.entry-history"
states:
  bounty-template:
    material: "PLAYER_HEAD"
    name: "{theme}{player}"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fAmount: {theme}${amount}"
      - "&7&l | &fSet by:"
      - "{contributions}"
      - " "
      - "{good}→ Click to View History ←"
  contribution-line:
    material: "PAPER"
    lore:
      - "&7&l | &f{theme}• {setter} {white}- {theme}${amount}"
  more-contributors:
    material: "PAPER"
    lore:
      - "&7&l | &f{muted}• More contributors hidden"
  filter-oldest:
    material: "PAPER"
    name: "Oldest"
  filter-newest:
    material: "PAPER"
    name: "Newest"
  filter-highest:
    material: "PAPER"
    name: "Highest"
  filter-lowest:
    material: "PAPER"
    name: "Lowest"
  label-no-search:
    material: "PAPER"
    name: "{muted}None"
  label-clear-search-target:
    material: "PAPER"
    name: "bounties"
  label-unknown-player:
    material: "PAPER"
    name: "Unknown"
decorations:
  info:
    slots:
      - 4
    material: "CLOCK"
    name: ":clock: {theme}&lINFO"
    lore:
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fUse {theme}/bounty add <player> <amount>"
      - "&7&l | &fYour bounty: {theme}${own_bounty}"
      - "&7&l | &fTotal earned: {theme}${total_earned}"
