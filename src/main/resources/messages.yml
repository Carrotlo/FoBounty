natural-lost: "{prefix}{bad}You lost a bounty worth {theme}${amount}{bad} due to natural death."
claim-blocked-alt: "{prefix}{bad}Claim blocked by anti-abuse IP/subnet rule."
claim-blocked-team: "{prefix}{bad}Claim blocked because both players are in the same team."
editor-saved: "{prefix}{good}Updated {theme}{setting}{good} to {theme}{value}{good}."
editor-invalid: "{prefix}{bad}Invalid value for {theme}{setting}{bad}."

editor:
  saved: "{prefix}{good}Updated {theme}{setting}{good} to {theme}{value}{good}."
  invalid-input: "{prefix}{bad}Invalid value for {theme}{setting}{bad}."
  save-failed: "{prefix}{bad}Could not save {theme}{setting}{bad}. {muted}{error}"
  cancelled: "{prefix}{muted}Editor input cancelled."
  opened: "{prefix}{theme}Editor opened."
  search-applied: "{prefix}{theme}Search applied: {white}{query}"
  search-cleared: "{prefix}{muted}Search cleared."
  item-required: "{prefix}{bad}Hold an item on your cursor or in your main hand first."
  deleted: "{prefix}{bad}Deleted {theme}{entry}{bad}."
